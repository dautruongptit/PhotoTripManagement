server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache tài nguyên tĩnh có hash trong tên (JS/CSS do Vite build)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API sang container backend Spring Boot (cùng dev-network, gọi qua tên
    # service "backend" thay vì IP/localhost). Nhờ đó frontend và backend dùng
    # chung origin -> khỏi cần cấu hình CORS ở backend.
    # Lưu ý port: backend thật (travelPhoto-API) mặc định chạy 8068, không phải 8080.
    location /api/ {
        proxy_pass http://backend:8068/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng timeout cho các API xử lý lâu (upload ảnh, báo cáo...)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Đăng nhập Google (Spring Security OAuth2 Login) KHÔNG nằm dưới "/api" —
    # đây là route mặc định của Spring Security, cần proxy riêng 2 nhóm:
    #   /oauth2/authorization/google  -> bắt đầu đăng nhập (redirect sang Google)
    #   /login/oauth2/code/google     -> Google gọi ngược lại đây sau khi người dùng đồng ý
    location /oauth2/ {
        proxy_pass http://backend:8068/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8068/login/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: mọi route không khớp file tĩnh đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
