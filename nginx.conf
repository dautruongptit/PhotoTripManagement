server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache tài nguyên tĩnh có hash trong tên (JS/CSS do Vite build)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi route không khớp file tĩnh đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
